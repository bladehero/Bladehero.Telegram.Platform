name: Format
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
jobs:
  check_formatting:
    runs-on: ubuntu-latest
    name: Check Formatting
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: |
          dotnet tool restore
          dotnet csharpier check .
