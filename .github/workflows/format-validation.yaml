name: Format
on:
  push:
    branches: ["master", "feature/**"]
  # Every pull request, whatever it targets: slices land on a feature/** branch, and a slice stacked on another
  # targets that slice's branch until it merges.
  pull_request:
jobs:
  check_formatting:
    runs-on: ubuntu-latest
    name: Check Formatting
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: |
          dotnet tool restore
          dotnet csharpier check .
