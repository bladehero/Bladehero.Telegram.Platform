name: .NET
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
jobs:
  build_and_test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x
      - name: Add GitHub Packages source
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/bladehero/index.json" \
            --name bladehero \
            --username ${{ github.actor }} \
            --password ${{ secrets.PAT_TOKEN }} \
            --store-password-in-clear-text
      - name: Add Nuget Source
        run: dotnet nuget add source --username bladehero --password ${{ secrets.GH_PAT }} --store-password-in-clear-text --name bladehero "https://nuget.pkg.github.com/bladehero/index.json"
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Test
        run: dotnet test --no-build --verbosity normal