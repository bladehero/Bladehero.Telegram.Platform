name: .NET
on:
  push:
    branches: ["master", "feature/**"]
  # Every pull request, whatever it targets: slices land on a feature/** branch, and a slice stacked on another
  # targets that slice's branch until it merges.
  pull_request:
jobs:
  build_and_test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Test
        run: dotnet test --no-build --verbosity normal
